                  ),
                ),
              );
            }
          }

          class EngGridPainter extends CustomPainter {
            final bool showGrid;
            final List<List<Offset>> strokes;
            EngGridPainter({required this.showGrid, required this.strokes});

            @override
            void paint(Canvas canvas, Size size) {
              if (showGrid) {
                final smallGrid = Paint()..color = const Color(0xFF0284C7).withOpacity(0.08)..strokeWidth = 1;
                final bigGrid = Paint()..color = const Color(0xFF0284C7).withOpacity(0.2)..strokeWidth = 1;
                for (double x = 0; x < size.width; x += 10) {
                  canvas.drawLine(Offset(x, 0), Offset(x, size.height), x % 50 == 0 ? bigGrid : smallGrid);
                }
                for (double y = 0; y < size.height; y += 10) {
                  canvas.drawLine(Offset(0, y), Offset(size.width, y), y % 50 == 0 ? bigGrid : smallGrid);
                }
              }
              final p = Paint()
                ..color = const Color(0xFF1E293B)
                ..strokeWidth = 2.5
                ..strokeCap = StrokeCap.round;
              for (final s in strokes) {
                for (int i = 0; i < s.length - 1; i++) {
                  canvas.drawLine(s[i], s[i + 1], p);
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }
