          // ================= 1. شاشة كشكول المذاكرة (10 ورقات سلك) =================
          class NotebookScreen extends StatefulWidget {
            final SharedPreferences prefs;
            const NotebookScreen({super.key, required this.prefs});

            @override
            State<NotebookScreen> createState() => _NotebookScreenState();
          }

          class _NotebookScreenState extends State<NotebookScreen> {
            int currentPage = 1;
            bool isPenMode = false;
            Color penColor = const Color(0xFF2D3436);
            final TextEditingController _textController = TextEditingController();
            final Map<int, List<List<Offset>>> pageStrokes = {};

            @override
            void initState() {
              super.initState();
              _loadPage();
            }

            void _loadPage() {
              _textController.text = widget.prefs.getString('nb_text_$currentPage') ?? '';
              setState(() {});
            }

            void _savePage() {
              widget.prefs.setString('nb_text_$currentPage', _textController.text);
            }

            @override
            Widget build(BuildContext context) {
              final strokes = pageStrokes[currentPage] ?? [];

              return Scaffold(
                backgroundColor: const Color(0xFF1A1A24),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF252836),
                  leading: IconButton(
                    icon: const Icon(Icons.arrow_back, color: Colors.white),
                    onPressed: () {
                      _savePage();
                      Navigator.pop(context);
                    },
                  ),
                  title: const Text('كشكول السلك (10 ورقات)', style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.bold)),
                  actions: [
                    IconButton(
                      icon: Icon(Icons.keyboard, color: !isPenMode ? const Color(0xFF6366F1) : Colors.white70),
                      onPressed: () => setState(() => isPenMode = false),
                    ),
                    IconButton(
                      icon: Icon(Icons.edit, color: isPenMode ? const Color(0xFF6366F1) : Colors.white70),
                      onPressed: () => setState(() => isPenMode = true),
                    ),
                    IconButton(
                      icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                      onPressed: () {
                        setState(() {
                          pageStrokes[currentPage] = [];
                          _textController.clear();
                          _savePage();
                        });
                      },
                    ),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Container(
                    decoration: BoxDecoration(
                      color: const Color(0xFFFFFDF7),
                      borderRadius: BorderRadius.circular(12),
                    ),
                    clipBehavior: Clip.antiAlias,
                    child: Stack(
                      children: [
                        CustomPaint(
                          size: Size.infinite,
                          painter: NotebookLinesPainter(strokes: strokes, penColor: penColor),
                        ),
                        Padding(
                          padding: const EdgeInsets.fromLTRB(16, 8, 45, 8),
                          child: IgnorePointer(
                            ignoring: isPenMode,
                            child: TextField(
                              controller: _textController,
                              maxLines: null,
                              expands: true,
                              onChanged: (_) => _savePage(),
                              style: const TextStyle(fontSize: 15, height: 2.13, color: Color(0xFF2D3436)),
                              decoration: const InputDecoration(
                                hintText: 'اكتب ملاحظاتك وملخصاتك هنا...',
                                border: InputBorder.none,
                              ),
                            ),
                          ),
                        ),
                        if (isPenMode)
                          GestureDetector(
                            onPanStart: (details) {
                              setState(() {
                                pageStrokes.putIfAbsent(currentPage, () => []);
                                pageStrokes[currentPage]!.add([details.localPosition]);
                              });
                            },
                            onPanUpdate: (details) {
                              setState(() {
                                pageStrokes[currentPage]!.last.add(details.localPosition);
                              });
                            },
                            child: Container(color: Colors.transparent),
                          ),
                      ],
                    ),
                  ),
                ),
                bottomNavigationBar: Container(
                  color: const Color(0xFF252836),
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      ElevatedButton(
                        onPressed: currentPage > 1
                            ? () {
                                _savePage();
                                setState(() => currentPage--);
                                _loadPage();
                              }
                            : null,
                        child: const Text('السابقة'),
                      ),
                      Text('ورقة $currentPage من 10', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      ElevatedButton(
                        onPressed: currentPage < 10
                            ? () {
                                _savePage();
                                setState(() => currentPage++);
                                _loadPage();
                              }
                            : null,
                        child: const Text('التالية'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class NotebookLinesPainter extends CustomPainter {
            final List<List<Offset>> strokes;
            final Color penColor;
            NotebookLinesPainter({required this.strokes, required this.penColor});

            @override
            void paint(Canvas canvas, Size size) {
              final linePaint = Paint()..color = const Color(0xFFE4E9ED)..strokeWidth = 1;
              for (double y = 32; y < size.height; y += 32) {
                canvas.drawLine(Offset(0, y), Offset(size.width, y), linePaint);
              }
              final marginPaint = Paint()..color = const Color(0xFFFF7675)..strokeWidth = 2;
              canvas.drawLine(Offset(size.width - 38, 0), Offset(size.width - 38, size.height), marginPaint);

              final strokePaint = Paint()
                ..color = penColor
                ..strokeWidth = 3
                ..strokeCap = StrokeCap.round
                ..style = PaintingStyle.stroke;

              for (final stroke in strokes) {
                for (int i = 0; i < stroke.length - 1; i++) {
                  canvas.drawLine(stroke[i], stroke[i + 1], strokePaint);
                }
              }
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          // ================= 2. الآلة الحاسبة الذكية =================
          class CalculatorDialog extends StatefulWidget {
            const CalculatorDialog({super.key});

            @override
            State<CalculatorDialog> createState() => _CalculatorDialogState();
          }

          class _CalculatorDialogState extends State<CalculatorDialog> {
            String expr = '';
            String history = '';

            void input(String c) {
              setState(() {
                if (expr == '0') expr = '';
                expr += c;
              });
            }

            void evaluate() {
              try {
                if (expr.isEmpty) return;
                setState(() {
                  history = '$expr =';
                  expr = _simpleEval(expr).toStringAsFixed(2).replaceAll(RegExp(r'\.00$'), '');
                });
              } catch (_) {
                setState(() => expr = 'خطأ');
              }
            }

            double _simpleEval(String s) {
              s = s.replaceAll('×', '*').replaceAll('÷', '/');
              if (s.contains('+')) {
                final parts = s.split('+');
                return double.parse(parts[0]) + double.parse(parts[1]);
              } else if (s.contains('-')) {
                final parts = s.split('-');
                return double.parse(parts[0]) - double.parse(parts[1]);
              } else if (s.contains('*')) {
                final parts = s.split('*');
                return double.parse(parts[0]) * double.parse(parts[1]);
              } else if (s.contains('/')) {
                final parts = s.split('/');
                return double.parse(parts[0]) / double.parse(parts[1]);
              }
              return double.parse(s);
            }

            @override
            Widget build(BuildContext context) {
              final buttons = ['C', '⌫', '%', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '='];
              return Dialog(
                backgroundColor: const Color(0xFF1E1B4B),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('آلة حاسبة الطلاب الذكية', style: TextStyle(color: Color(0xFFA5B4FC), fontWeight: FontWeight.bold)),
                          IconButton(icon: const Icon(Icons.close, color: Colors.redAccent), onPressed: () => Navigator.pop(context)),
                        ],
                      ),
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: const Color(0xFF0F172A), borderRadius: BorderRadius.circular(12)),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.end,
                          children: [
                            Text(history, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                            Text(expr.isEmpty ? '0' : expr, style: const TextStyle(color: Color(0xFF38BDF8), fontSize: 26, fontWeight: FontWeight.bold)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 12),
                      GridView.builder(
                        shrinkWrap: true,
                        itemCount: buttons.length,
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 4,
                          mainAxisSpacing: 8,
                          crossAxisSpacing: 8,
                          childAspectRatio: 1.3,
                        ),
                        itemBuilder: (context, index) {
                          final b = buttons[index];
                          return ElevatedButton(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: b == '=' ? const Color(0xFF10B981) : (b == 'C' || b == '⌫' ? const Color(0xFFEF4444) : const Color(0xFF312E81)),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                            ),
                            onPressed: () {
                              if (b == 'C') setState(() { expr = ''; history = ''; });
                              else if (b == '⌫') setState(() { if (expr.isNotEmpty) expr = expr.substring(0, expr.length - 1); });
                              else if (b == '=') evaluate();
                              else input(b);
                            },
                            child: Text(b, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          );
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ================= 3. جدول دروسي ومواعيدي =================
          class ScheduleDialog extends StatefulWidget {
            final SharedPreferences prefs;
            const ScheduleDialog({super.key, required this.prefs});

            @override
            State<ScheduleDialog> createState() => _ScheduleDialogState();
          }

          class _ScheduleDialogState extends State<ScheduleDialog> {
            final TextEditingController _subjCtrl = TextEditingController();
            final TextEditingController _timeCtrl = TextEditingController();
            String selectedDay = 'السبت';
            List<Map<String, String>> items = [];

            @override
            void initState() {
              super.initState();
              final raw = widget.prefs.getString('fanni_student_schedule');
              if (raw != null) {
                items = List<Map<String, String>>.from(json.decode(raw).map((e) => Map<String, String>.from(e)));
              } else {
                items = [
                  {'subj': 'رياضيات تطبيقية وفيزياء', 'day': 'السبت', 'time': '4:00 عصراً'},
                  {'subj': 'الرسم الفني والهندسي', 'day': 'الإثنين', 'time': '6:00 مساءً'},
                ];
              }
            }

            void _save() {
              widget.prefs.setString('fanni_student_schedule', json.encode(items));
            }

            @override
            Widget build(BuildContext context) {
              return Dialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text('جدول دروسي ومواعيدي 📅', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: Color(0xFF6366F1))),
                            IconButton(icon: const Icon(Icons.close), onPressed: () => Navigator.pop(context)),
                          ],
                        ),
                        TextField(controller: _subjCtrl, decoration: const InputDecoration(labelText: 'اسم المادة أو الدرس')),
                        const SizedBox(height: 8),
                        Row(
                          children: [
                            Expanded(
                              child: DropdownButton<String>(
                                value: selectedDay,
                                isExpanded: true,
                                items: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة']
                                    .map((d) => DropdownMenuItem(value: d, child: Text(d)))
                                    .toList(),
                                onChanged: (v) => setState(() => selectedDay = v!),
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(child: TextField(controller: _timeCtrl, decoration: const InputDecoration(labelText: 'الموعد'))),
                          ],
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFF59E0B), foregroundColor: Colors.white),
                            onPressed: () {
                              if (_subjCtrl.text.trim().isEmpty) return;
                              setState(() {
                                items.insert(0, {
                                  'subj': _subjCtrl.text.trim(),
                                  'day': selectedDay,
                                  'time': _timeCtrl.text.trim().isEmpty ? 'غير محدد' : _timeCtrl.text.trim(),
                                });
                                _subjCtrl.clear();
                                _timeCtrl.clear();
                                _save();
                              });
                            },
                            child: const Text('إضافة الموعد للجدول'),
                          ),
                        ),
                        const SizedBox(height: 12),
                        ...items.asMap().entries.map((entry) {
                          final idx = entry.key;
                          final item = entry.value;
                          return Card(
                            margin: const EdgeInsets.only(bottom: 6),
                            child: ListTile(
                              title: Text(item['subj']!, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                              subtitle: Text('${item['day']} - ${item['time']}', style: const TextStyle(fontSize: 11)),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete, color: Colors.redAccent, size: 18),
                                onPressed: () {
                                  setState(() {
                                    items.removeAt(idx);
                                    _save();
                                  });
                                },
                              ),
                            ),
                          );
                        }),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          // ================= 4. كراسة الرسم الهندسي =================
          class EngineeringBoardScreen extends StatefulWidget {
            const EngineeringBoardScreen({super.key});

            @override
            State<EngineeringBoardScreen> createState() => _EngineeringBoardScreenState();
          }

          class _EngineeringBoardScreenState extends State<EngineeringBoardScreen> {
            bool showGrid = true;
            final List<List<Offset>> strokes = [];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF14161F),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF252836),
                  leading: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () => Navigator.pop(context)),
                  title: const Text('كراسة الرسم الهندسي 📐', style: TextStyle(color: Colors.white, fontSize: 14)),
                  actions: [
                    IconButton(
                      icon: Icon(Icons.grid_on, color: showGrid ? const Color(0xFF38BDF8) : Colors.white54),
                      onPressed: () => setState(() => showGrid = !showGrid),
                    ),
                    IconButton(
                      icon: const Icon(Icons.delete, color: Colors.redAccent),
                      onPressed: () => setState(() => strokes.clear()),
                    ),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(10),
                  child: Container(
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(8),
                      border: Border.all(color: const Color(0xFF0284C7), width: 2),
                    ),
                    clipBehavior: Clip.antiAlias,
                    child: GestureDetector(
                      onPanStart: (d) => setState(() => strokes.add([d.localPosition])),
                      onPanUpdate: (d) => setState(() => strokes.last.add(d.localPosition)),
                      child: CustomPaint(
                        size: Size.infinite,
                        painter: EngGridPainter(showGrid: showGrid, strokes: strokes),
                      ),
