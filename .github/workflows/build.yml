name: Build Local HTML Flutter App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project & Add WebView
        run: |
          flutter create --org com.html.fannipro --project-name html_app app_project
          cd app_project
          flutter pub add webview_flutter

      - name: Create Assets & HTML File
        run: |
          cd app_project
          mkdir assets
          cat << 'EOF' > assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>فني برو</title>
              <style>
                  body { background: #1e1b4b; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
                  h1 { color: #38bdf8; font-size: 26px; }
                  p { color: #94a3b8; margin-top: 10px; }
              </style>
          </head>
          <body>
              <h1>تطبيق فني برو 🚀</h1>
              <p>يعمل الآن بتصميم الـ HTML المحلي وبسرعة خيالية داخل فلوتر!</p>
          </body>
          </html>
          EOF

      - name: Update pubspec.yaml for Assets
        run: |
          cd app_project
          echo "  assets:" >> pubspec.yaml
          echo "    - assets/index.html" >> pubspec.yaml

      - name: Configure Android Manifest
        run: |
          cd app_project
          sed -i 's/android:label="html_app"/android:label="فني برو"/g' android/app/src/main/AndroidManifest.xml

      - name: Write Flutter WebView Controller Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: LocalHtmlScreen(),
            ));
          }

          class LocalHtmlScreen extends StatefulWidget {
            const LocalHtmlScreen({super.key});

            @override
            State<LocalHtmlScreen> createState() => _LocalHtmlScreenState();
          }

          class _LocalHtmlScreenState extends State<LocalHtmlScreen> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadFlutterAsset('assets/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }
          EOF

      - name: Build APK and AAB
        run: |
          cd app_project
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-app-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
