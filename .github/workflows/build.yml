name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter
          flutter pub add webview_flutter_android
          flutter pub add onesignal_flutter
          flutter pub add share_plus

      - name: Write Clean Root build.gradle with Kotlin 1.9.10
        run: |
          cat << 'EOF' > app_project/android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Write AndroidManifest
        run: |
          cat << 'EOF' > app_project/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="فني برو"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write app build.gradle Cleanly
        run: |
          cat << 'EOF' > app_project/android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.pro.ap4016842.skn"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.pro.ap4016842.skn"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 11
                  versionName = "1.1"
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

      - name: Write settings.gradle with Kotlin 1.9.10
        run: |
          cat << 'EOF' > app_project/android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.2.1" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
          }

          include ":app"
          EOF

      - name: Write Full Flutter Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:onesignal_flutter/onesignal_flutter.dart';
          import 'package:share_plus/share_plus.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            
            // تهيئة خدمة OneSignal الأصلية
            OneSignal.Debug.setLogLevel(OSLogLevel.none);
            OneSignal.initialize("e405d6b4-3828-482c-b294-5a77c30cdd9a");
            OneSignal.Notifications.requestPermission(true);

            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FaniProScreen(),
            ));
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();

              final PlatformWebViewControllerCreationParams params =
                  const PlatformWebViewControllerCreationParams();
              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..addJavaScriptChannel(
                  'AppShare',
                  onMessageReceived: (JavaScriptMessage message) {
                    Share.share(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (String url) => setState(() => _isLoading = true),
                    onPageFinished: (String url) {
                      setState(() => _isLoading = false);
                      controller.runJavaScript("if (window.updateBadgeUI) { window.updateBadgeUI(); }");
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://hrinnf.blogspot.com/'));

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                (controller.platform as AndroidWebViewController)
                    .setMediaPlaybackRequiresUserGesture(false);
              }

              // استقبال الإشعار وتمريره للصفحة أثناء فتح التطبيق
              OneSignal.Notifications.addForegroundWillDisplayListener((event) {
                final notif = event.notification;
                final title = (notif.title ?? 'تنبيه جديد').replaceAll("'", "\\'");
                final body = (notif.body ?? '').replaceAll("'", "\\'");
                final launchUrl = (notif.additionalData?['launch_url'] ?? '').toString().replaceAll("'", "\\'");

                controller.runJavaScript("""
                  if (window.onNewNotificationReceived) {
                    window.onNewNotificationReceived();
                  }
                  if (window.saveIncomingNotification) {
                    window.saveIncomingNotification('$title', '$body', '$launchUrl');
                  }
                """);
              });

              // عند ضغط الطالب على الإشعار من شريط التنبيهات وهو خارج التطبيق
              OneSignal.Notifications.addClickListener((event) {
                final launchUrl = event.notification.additionalData?['launch_url'];
                if (launchUrl != null && launchUrl.toString().isNotEmpty) {
                  controller.loadRequest(Uri.parse(launchUrl.toString()));
                }
              });

              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF6C5CE7),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(
                              color: Colors.white,
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Both AAB and APK
        run: |
          cd app_project
          flutter build appbundle --release --no-pub
          flutter build apk --release --no-pub

      - name: Upload Both Files
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
