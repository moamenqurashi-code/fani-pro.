name: Build Full Native Fani Pro 2027

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project & Add Dependencies
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add share_plus
          flutter pub add http

      - name: Configure Android Manifest & Version
        run: |
          cd app_project
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="skn"/android:label="فني برو"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 12/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.2"/g' android/app/build.gradle

      - name: Write Complete Native Flutter Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:share_plus/share_plus.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final prefs = await SharedPreferences.getInstance();
            runApp(FaniProApp(prefs: prefs));
          }

          class FaniProApp extends StatefulWidget {
            final SharedPreferences prefs;
            const FaniProApp({super.key, required this.prefs});

            @override
            State<FaniProApp> createState() => _FaniProAppState();
          }

          class _FaniProAppState extends State<FaniProApp> {
            late bool isStudyLamp;

            @override
            void initState() {
              super.initState();
              isStudyLamp = widget.prefs.getBool('fanni_study_lamp') ?? false;
            }

            void toggleLamp() {
              setState(() {
                isStudyLamp = !isStudyLamp;
                widget.prefs.setBool('fanni_study_lamp', isStudyLamp);
              });
            }

            @override
            Widget build(BuildContext context) {
              final bgColor = isStudyLamp ? const Color(0xFF1C1917) : const Color(0xFFF1F5F9);
              final surfaceColor = isStudyLamp ? const Color(0xFF292524) : Colors.white;
              final textColor = isStudyLamp ? const Color(0xFFFEF3C7) : const Color(0xFF1E293B);
              final borderColor = isStudyLamp ? const Color(0xFF44403C) : const Color(0xFFE2E8F0);

              return MaterialApp(
                title: 'تطبيق فني برو',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: bgColor,
                  primaryColor: const Color(0xFF6366F1),
                  cardColor: surfaceColor,
                  dividerColor: borderColor,
                  textTheme: TextTheme(
                    bodyLarge: TextStyle(color: textColor, fontFamily: 'sans-serif'),
                    bodyMedium: TextStyle(color: textColor, fontFamily: 'sans-serif'),
                  ),
                ),
                builder: (context, child) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child: child!,
                  );
                },
                home: HomeScreen(
                  prefs: widget.prefs,
                  isStudyLamp: isStudyLamp,
                  onToggleLamp: toggleLamp,
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final SharedPreferences prefs;
            final bool isStudyLamp;
            final VoidCallback onToggleLamp;

            const HomeScreen({
              super.key,
              required this.prefs,
              required this.isStudyLamp,
              required this.onToggleLamp,
            });

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final GlobalKey<ScaffoldState> _scaffoldKey = GlobalKey<ScaffoldState>();
            int onlineUsers = 47;
            late Timer _onlineTimer;

            final Map<String, int> defaultViews = {
              'view_memo_2027': 28900,
              'view_exams_2027': 15200,
              'view_lessons_2027': 18700,
              'view_predict_2027': 19400,
              'view_results_2027': 45100,
              'view_calc_2027': 32100,
              'view_eq_2027': 14200,
              'view_coord_2027': 22500,
              'view_quiz_2027': 10400,
              'view_hamas_2027': 21500,
              'view_notebook_app': 31200,
              'view_calculator_tool': 18400,
              'view_schedule_tool': 24600,
              'view_eng_tool': 29800,
              'view_all_platforms': 12400,
            };

            @override
            void initState() {
              super.initState();
              _onlineTimer = Timer.periodic(const Duration(seconds: 7), (_) {
                if (mounted) {
                  setState(() {
                    onlineUsers = math.max(35, onlineUsers + (math.Random().nextInt(5) - 2));
                  });
                }
              });
            }

            @override
            void dispose() {
              _onlineTimer.cancel();
              super.dispose();
            }

            int getViews(String key) {
              return widget.prefs.getInt(key) ?? defaultViews[key] ?? 1000;
            }

            void incrementView(String key) {
              final current = getViews(key) + 1;
              setState(() {
                widget.prefs.setInt(key, current);
              });
            }

            String formatViews(int num) {
              if (num >= 1000) return '${(num / 1000).toStringAsFixed(1)}K';
              return num.toString();
            }

            Future<void> openUrl(String pathOrUrl) async {
              String fullUrl = pathOrUrl.startsWith('http')
                  ? pathOrUrl
                  : 'https://hrinnf.blogspot.com$pathOrUrl';
              final uri = Uri.parse(fullUrl);
              if (await canLaunchUrl(uri)) {
                await launchUrl(uri, mode: LaunchMode.externalApplication);
              }
            }

            void openNotebook() {
              incrementView('view_notebook_app');
              Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => NotebookScreen(prefs: widget.prefs)),
              );
            }

            void openCalculator() {
              incrementView('view_calculator_tool');
              showDialog(
                context: context,
                builder: (_) => const CalculatorDialog(),
              );
            }

            void openSchedule() {
              incrementView('view_schedule_tool');
              showDialog(
                context: context,
                builder: (_) => ScheduleDialog(prefs: widget.prefs),
              );
            }

            void openEngineering() {
              incrementView('view_eng_tool');
              Navigator.push(
                context,
                MaterialPageRoute(builder: (_) => const EngineeringBoardScreen()),
              );
            }

            @override
            Widget build(BuildContext context) {
