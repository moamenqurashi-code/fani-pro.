name: Build Full Native Thanaweya Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Thanaweya Flutter Project
        run: |
          flutter create --org com.thanaweya.pro401 --project-name thanaweya_app app_project
          cd app_project
          flutter pub add shared_preferences
          flutter pub add url_launcher
          flutter pub add share_plus
          flutter pub add http

      - name: Configure Android Manifest & Version
        run: |
          cd app_project
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="thanaweya_app"/android:label="ثانوية برو"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode flutterVersionCode.toInteger()/versionCode 101/g' android/app/build.gradle
          sed -i 's/versionName flutterVersionName/versionName "1.0.1"/g' android/app/build.gradle

      - name: Write Complete Thanaweya Pro Flutter Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:share_plus/share_plus.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final prefs = await SharedPreferences.getInstance();
            runApp(ThanaweyaApp(prefs: prefs));
          }

          class ThanaweyaApp extends StatefulWidget {
            final SharedPreferences prefs;
            const ThanaweyaApp({super.key, required this.prefs});

            @override
            State<ThanaweyaApp> createState() => _ThanaweyaAppState();
          }

          class _ThanaweyaAppState extends State<ThanaweyaApp> {
            late bool isStudyLamp;

            @override
            void initState() {
              super.initState();
              isStudyLamp = widget.prefs.getBool('thanaweya_study_lamp') ?? false;
            }

            void toggleLamp() {
              setState(() {
                isStudyLamp = !isStudyLamp;
                widget.prefs.setBool('thanaweya_study_lamp', isStudyLamp);
              });
            }

            @override
            Widget build(BuildContext context) {
              final bgColor = isStudyLamp ? const Color(0xFF1C1917) : const Color(0xFFF8FAFC);
              final surfaceColor = isStudyLamp ? const Color(0xFF292524) : Colors.white;
              final textColor = isStudyLamp ? const Color(0xFFFEF3C7) : const Color(0xFF0F172A);
              final borderColor = isStudyLamp ? const Color(0xFF44403C) : const Color(0xFFE2E8F0);

              return MaterialApp(
                title: 'ثانوية برو - الثانوية العامة',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: bgColor,
                  primaryColor: const Color(0xFF2563EB),
                  cardColor: surfaceColor,
                  dividerColor: borderColor,
                  textTheme: TextTheme(
                    bodyLarge: TextStyle(color: textColor, fontFamily: 'sans-serif'),
                    bodyMedium: TextStyle(color: textColor, fontFamily: 'sans-serif'),
                  ),
                ),
                builder: (context, child) {
                  return Directionality(
                    textDirection: TextDirection.rtl,
                    child: child!,
                  );
                },
                home: HomeScreen(
                  prefs: widget.prefs,
                  isStudyLamp: isStudyLamp,
                  onToggleLamp: toggleLamp,
                ),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            final SharedPreferences prefs;
            final bool isStudyLamp;
            final VoidCallback onToggleLamp;

            const HomeScreen({
              super.key,
              required this.prefs,
              required this.isStudyLamp,
              required this.onToggleLamp,
            });

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final GlobalKey<ScaffoldState> _scaffoldKey = GlobalKey<ScaffoldState>();
            int onlineStudents = 320;
            late Timer _timer;

            @override
            void initState() {
              super.initState();
              _timer = Timer.periodic(const Duration(seconds: 6), (_) {
                if (mounted) {
                  setState(() {
                    onlineStudents = math.max(280, onlineStudents + (math.Random().nextInt(7) - 3));
                  });
                }
              });
            }

            @override
            void dispose() {
              _timer.cancel();
              super.dispose();
            }

            Future<void> openUrl(String url) async {
              final uri = Uri.parse(url);
              if (await canLaunchUrl(uri)) {
                await launchUrl(uri, mode: LaunchMode.externalApplication);
              }
            }

            void openNotebook() {
              Navigator.push(context, MaterialPageRoute(builder: (_) => NotebookScreen(prefs: widget.prefs)));
            }

            void openCalculator() {
              showDialog(context: context, builder: (_) => const ThanaweyaCalculatorDialog());
            }

            void openSchedule() {
              showDialog(context: context, builder: (_) => ScheduleDialog(prefs: widget.prefs));
            }

            void openFocusTimer() {
              showDialog(context: context, builder: (_) => const FocusTimerDialog());
            }

            @override
            Widget build(BuildContext context) {
              final surfaceColor = widget.isStudyLamp ? const Color(0xFF292524) : Colors.white;
              final textColor = widget.isStudyLamp ? const Color(0xFFFEF3C7) : const Color(0xFF0F172A);
              final lightText = widget.isStudyLamp ? const Color(0xFFD6D3D1) : const Color(0xFF64748B);
              final borderCol = widget.isStudyLamp ? const Color(0xFF44403C) : const Color(0xFFE2E8F0);

              return Scaffold(
                key: _scaffoldKey,
                drawer: _buildSidebar(surfaceColor, textColor, lightText, borderCol),
                appBar: PreferredSize(
                  preferredSize: const Size.fromHeight(56),
                  child: Container(
                    decoration: const BoxDecoration(
                      gradient: LinearGradient(
                        colors: [Color(0xFF1D4ED8), Color(0xFF2563EB)],
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                      ),
                      boxShadow: [BoxShadow(color: Colors.black12, blurRadius: 6)],
                    ),
                    child: SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 12),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            _headerIconBtn(Icons.menu, () => _scaffoldKey.currentState?.openDrawer()),
                            Row(
                              children: [
                                Container(
                                  width: 32,
                                  height: 32,
                                  decoration: BoxDecoration(
                                    color: Colors.white.withOpacity(0.2),
                                    borderRadius: BorderRadius.circular(8),
                                  ),
                                  child: const Icon(Icons.menu_book, color: Colors.white, size: 18),
                                ),
                                const SizedBox(width: 8),
                                const Column(
                                  mainAxisAlignment: MainAxisAlignment.center,
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text('ثانوية برو', style: TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.w800)),
                                    Text('بوابة التفوق والدرجة النهائية', style: TextStyle(color: Colors.white70, fontSize: 10, fontWeight: FontWeight.w600)),
                                  ],
                                ),
                              ],
                            ),
                            _headerIconBtn(Icons.share, () {
                              Share.share('حمل تطبيق "ثانوية برو" الشامل لمتابعة المناهج والمذكرات وتنسيق الثانوية العامة:\nhttps://play.google.com/');
                            }),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
                body: ListView(
                  padding: const EdgeInsets.fromLTRB(8, 12, 8, 90),
                  children: [
                    // شريط الأدوات الذكية السريعة
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 4),
                      child: Row(
                        children: [
                          _buildTopToolBtn('لمبة السهر', Icons.lightbulb, const [Color(0xFFF59E0B), Color(0xFFD97706)], widget.isStudyLamp, widget.onToggleLamp, surfaceColor, textColor, borderCol),
                          const SizedBox(width: 6),
                          _buildTopToolBtn('حاسبة المجموع', Icons.calculate, const [Color(0xFF10B981), Color(0xFF047857)], false, openCalculator, surfaceColor, textColor, borderCol),
                          const SizedBox(width: 6),
                          _buildTopToolBtn('غرفة التركيز', Icons.timer, const [Color(0xFF8B5CF6), Color(0xFF6D28D9)], false, openFocusTimer, surfaceColor, textColor, borderCol),
                          const SizedBox(width: 6),
                          _buildTopToolBtn('جدول الحصص', Icons.event_note, const [Color(0xFF0284C7), Color(0xFF0369A1)], false, openSchedule, surfaceColor, textColor, borderCol),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),

                    _sectionHeader(Icons.auto_stories, 'مناهج وشروحات الثانوية العامة 2027', textColor),
                    _grid2([
                      _card('اللغة العربية والفرعيات', 'النحو والبلاغة والأدب', const [Color(0xFF2563EB), Color(0xFF1D4ED8)], Icons.menu_book, surfaceColor, textColor, lightText, borderCol, () {}),
                      _card('اللغة الإنجليزية واللغات', 'الكلمات والجرامر والقواعد', const [Color(0xFF059669), Color(0xFF047857)], Icons.language, surfaceColor, textColor, lightText, borderCol, () {}),
                      _card('الفيزياء والرياضيات', 'المسائل والتحليل والامتحانات', const [Color(0xFFD97706), Color(0xFFB45309)], Icons.science, surfaceColor, textColor, lightText, borderCol, () {}),
                      _card('الكيمياء والأحياء', 'المعادلات والأبواب والرسومات', const [Color(0xFFDC2626), Color(0xFFB91C1C)], Icons.biotech, surfaceColor, textColor, lightText, borderCol, () {}),
                    ]),

                    const SizedBox(height: 14),
                    _sectionHeader(Icons.assignment_turned_in, 'بنك التدريبات ونظام (أوبن بوك)', textColor, iconColor: const Color(0xFF10B981)),
                    _grid2([
                      _card('اختبارات تفاعلية لكل درس', 'تصحيح فوري ومستويات عليا', const [Color(0xFF7C3AED), Color(0xFF5B21B6)], Icons.quiz, surfaceColor, textColor, lightText, borderCol, () {}),
                      _card('امتحانات السنوات السابقة', 'الدور الأول والثاني بالحلول', const [Color(0xFF0284C7), Color(0xFF075985)], Icons.fact_check, surfaceColor, textColor, lightText, borderCol, () {}),
                    ]),

                    const SizedBox(height: 14),
                    _sectionHeader(Icons.workspace_premium, 'أدوات التفوق الذكية', textColor, iconColor: const Color(0xFFF59E0B)),
                    _grid2([
                      _card('كشكول المذاكرة السلك 📝', '10 ورقات رسم وكتابة وتلخيص', const [Color(0xFF312E81), Color(0xFF1E1B4B)], Icons.edit_note, surfaceColor, textColor, lightText, borderCol, openNotebook),
                      _card('حاسبة التنسيق والمجاميع 🧮', 'احسب نسبتك المئوية بدقة تامة', const [Color(0xFF065F46), Color(0xFF047857)], Icons.percent, surfaceColor, textColor, lightText, borderCol, openCalculator),
                    ]),

                    const SizedBox(height: 14),
                    // شات ومجتمع طلاب الثانوية العامة
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 4),
                      child: Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(colors: [Color(0xFF1E1B4B), Color(0xFF312E81)]),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                const Row(
                                  children: [
                                    Icon(Icons.forum, color: Color(0xFF38BDF8), size: 22),
                                    SizedBox(width: 8),
                                    Text('مجتمع طلاب الثانوية العامة', style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.w800)),
                                  ],
                                ),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                                  decoration: BoxDecoration(color: Colors.green.withOpacity(0.2), borderRadius: BorderRadius.circular(20)),
                                  child: Row(
                                    children: [
                                      Container(width: 6, height: 6, decoration: const BoxDecoration(color: Colors.greenAccent, shape: BoxShape.circle)),
                                      const SizedBox(width: 4),
                                      Text('$onlineStudents طالب متصل', style: const TextStyle(color: Colors.greenAccent, fontSize: 10, fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            const Text('مساحة آمنة لطرح الأسئلة، تبادل الملخصات، والدعم المعنوي طوال فترة الامتحانات.', style: TextStyle(color: Colors.white70, fontSize: 11.5, height: 1.4)),
                            const SizedBox(height: 12),
                            ElevatedButton(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFF2563EB),
                                foregroundColor: Colors.white,
                                minimumSize: const Size(double.infinity, 38),
                                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                              ),
                              onPressed: () => openUrl('https://t.me/'),
                              child: const Text('انضم لقروب الدعم والمناقشة', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
                bottomNavigationBar: Container(
                  decoration: BoxDecoration(color: surfaceColor, border: Border(top: BorderSide(color: borderCol))),
                  padding: const EdgeInsets.symmetric(vertical: 6),
                  child: SafeArea(
                    child: Row(
                      mainAxisAlignment: MainAxisAlignment.spaceAround,
                      children: [
                        _bottomNavItem(Icons.home, 'الرئيسية', true, () {}),
                        _bottomNavItem(Icons.edit_note, 'الكشكول', false, openNotebook),
                        _bottomNavItem(Icons.calculate, 'الحاسبة', false, openCalculator),
                        _bottomNavItem(Icons.timer, 'التركيز', false, openFocusTimer),
                        _bottomNavItem(Icons.share, 'مشاركة', false, () {
                          Share.share('تطبيق ثانوية برو - دليلك الأول للتفوق في الثانوية العامة!');
                        }),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _headerIconBtn(IconData icon, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(8),
                child: Container(
                  width: 38,
                  height: 38,
                  decoration: BoxDecoration(color: Colors.white.withOpacity(0.15), borderRadius: BorderRadius.circular(8)),
                  child: Icon(icon, color: Colors.white, size: 20),
                ),
              );
            }

            Widget _buildTopToolBtn(String label, IconData icon, List<Color> colors, bool isActive, VoidCallback onTap, Color surfaceColor, Color textColor, Color borderCol) {
              return Expanded(
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(12),
                  child: Container(
                    padding: const EdgeInsets.symmetric(vertical: 8, horizontal: 2),
                    decoration: BoxDecoration(
                      color: isActive ? const Color(0xFFF59E0B).withOpacity(0.15) : surfaceColor,
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: isActive ? const Color(0xFFF59E0B) : borderCol),
                    ),
                    child: Column(
                      children: [
                        Container(
                          width: 30,
                          height: 30,
                          decoration: BoxDecoration(gradient: LinearGradient(colors: colors), borderRadius: BorderRadius.circular(8)),
                          child: Icon(icon, color: Colors.white, size: 15),
                        ),
                        const SizedBox(height: 4),
                        Text(label, textAlign: TextAlign.center, style: TextStyle(fontSize: 10, fontWeight: FontWeight.w800, color: textColor)),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _sectionHeader(IconData icon, String title, Color textColor, {Color iconColor = const Color(0xFF2563EB)}) {
              return Padding(
                padding: const EdgeInsets.fromLTRB(4, 6, 4, 8),
                child: Row(
                  children: [
                    Icon(icon, color: iconColor, size: 20),
                    const SizedBox(width: 6),
                    Text(title, style: TextStyle(fontSize: 14, fontWeight: FontWeight.w800, color: textColor)),
                  ],
                ),
              );
            }

            Widget _grid2(List<Widget> children) {
              List<Widget> rows = [];
              for (int i = 0; i < children.length; i += 2) {
                rows.add(
                  Padding(
                    padding: const EdgeInsets.only(bottom: 6),
                    child: Row(
                      children: [
                        Expanded(child: children[i]),
                        const SizedBox(width: 6),
                        Expanded(child: i + 1 < children.length ? children[i + 1] : const SizedBox()),
                      ],
                    ),
                  ),
                );
              }
              return Column(children: rows);
            }

            Widget _card(String title, String subtitle, List<Color> gradient, IconData icon, Color surfaceColor, Color textColor, Color lightText, Color borderCol, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(12),
                child: Container(
                  decoration: BoxDecoration(color: surfaceColor, borderRadius: BorderRadius.circular(12), border: Border.all(color: borderCol)),
                  clipBehavior: Clip.antiAlias,
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Container(
                        height: 85,
                        width: double.infinity,
                        decoration: BoxDecoration(gradient: LinearGradient(colors: gradient)),
                        child: Center(child: Icon(icon, size: 36, color: Colors.white)),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(10),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(title, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 12, fontWeight: FontWeight.w800, color: textColor)),
                            const SizedBox(height: 3),
                            Text(subtitle, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 10, color: lightText, fontWeight: FontWeight.w600)),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _bottomNavItem(IconData icon, String label, bool active, VoidCallback onTap) {
              final color = active ? const Color(0xFF2563EB) : const Color(0xFF64748B);
              return InkWell(
                onTap: onTap,
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 2),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Icon(icon, color: color, size: 21),
                      const SizedBox(height: 2),
                      Text(label, style: TextStyle(color: color, fontSize: 10, fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
              );
            }

            Widget _buildSidebar(Color surfaceColor, Color textColor, Color lightText, Color borderCol) {
              return Drawer(
                backgroundColor: surfaceColor,
                child: Column(
                  children: [
                    Container(
                      width: double.infinity,
                      padding: const EdgeInsets.fromLTRB(16, 45, 16, 16),
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(colors: [Color(0xFF1D4ED8), Color(0xFF2563EB)]),
                      ),
                      child: const Row(
                        children: [
                          CircleAvatar(backgroundColor: Colors.white24, child: Text('🎓', style: TextStyle(fontSize: 20))),
                          SizedBox(width: 10),
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('طالب الثانوية العامة', style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.bold)),
                              Text('دفعة التفوق 2027', style: TextStyle(color: Colors.white70, fontSize: 11)),
                            ],
                          ),
                        ],
                      ),
                    ),
                    Expanded(
                      child: ListView(
                        padding: EdgeInsets.zero,
                        children: [
                          _drawerTile(Icons.home, 'الرئيسية', () => Navigator.pop(context), textColor),
                          _drawerTile(Icons.edit_note, 'كشكول المذاكرة (10 ورقات)', () { Navigator.pop(context); openNotebook(); }, textColor),
                          _drawerTile(Icons.calculate, 'حاسبة المجموع والنسبة', () { Navigator.pop(context); openCalculator(); }, textColor),
                          _drawerTile(Icons.timer, 'غرفة التركيز (بومودورو)', () { Navigator.pop(context); openFocusTimer(); }, textColor),
                          _drawerTile(Icons.event_note, 'جدول الحصص والمواعيد', () { Navigator.pop(context); openSchedule(); }, textColor),
                          _drawerTile(Icons.info_outline, 'عن التطبيق', () => openUrl('https://play.google.com/'), textColor),
                        ],
                      ),
                    ),
                    Padding(
                      padding: const EdgeInsets.all(12),
                      child: Text('ثانوية برو © 2027', style: TextStyle(color: lightText, fontSize: 11, fontWeight: FontWeight.bold)),
                    ),
                  ],
                ),
              );
            }

            Widget _drawerTile(IconData icon, String title, VoidCallback onTap, Color textColor) {
              return ListTile(
                leading: Icon(icon, color: const Color(0xFF2563EB), size: 20),
                title: Text(title, style: TextStyle(fontSize: 12.5, fontWeight: FontWeight.bold, color: textColor)),
                dense: true,
                onTap: onTap,
              );
            }
          }

          // شاشة كشكول المذاكرة 10 ورقات
          class NotebookScreen extends StatefulWidget {
            final SharedPreferences prefs;
            const NotebookScreen({super.key, required this.prefs});

            @override
            State<NotebookScreen> createState() => _NotebookScreenState();
          }

          class _NotebookScreenState extends State<NotebookScreen> {
            int page = 1;
            bool isPen = false;
            final TextEditingController _ctrl = TextEditingController();
            final Map<int, List<List<Offset>>> strokes = {};

            @override
            void initState() {
              super.initState();
              _load();
            }

            void _load() {
              _ctrl.text = widget.prefs.getString('thanaweya_nb_$page') ?? '';
              setState(() {});
            }

            void _save() {
              widget.prefs.setString('thanaweya_nb_$page', _ctrl.text);
            }

            @override
            Widget build(BuildContext context) {
              final pageStrokes = strokes[page] ?? [];
              return Scaffold(
                backgroundColor: const Color(0xFF1A1A24),
                appBar: AppBar(
                  backgroundColor: const Color(0xFF252836),
                  leading: IconButton(icon: const Icon(Icons.arrow_back, color: Colors.white), onPressed: () { _save(); Navigator.pop(context); }),
                  title: const Text('كشكول المذاكرة (10 ورقات)', style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.bold)),
                  actions: [
                    IconButton(icon: Icon(Icons.keyboard, color: !isPen ? Colors.blue : Colors.white70), onPressed: () => setState(() => isPen = false)),
                    IconButton(icon: Icon(Icons.edit, color: isPen ? Colors.blue : Colors.white70), onPressed: () => setState(() => isPen = true)),
                    IconButton(icon: const Icon(Icons.delete_outline, color: Colors.red), onPressed: () { setState(() { strokes[page] = []; _ctrl.clear(); _save(); }); }),
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(10),
                  child: Container(
                    decoration: BoxDecoration(color: const Color(0xFFFFFDF7), borderRadius: BorderRadius.circular(10)),
                    clipBehavior: Clip.antiAlias,
                    child: Stack(
                      children: [
                        CustomPaint(size: Size.infinite, painter: NbPainter(pageStrokes)),
                        Padding(
                          padding: const EdgeInsets.fromLTRB(16, 8, 40, 8),
                          child: IgnorePointer(
                            ignoring: isPen,
                            child: TextField(
                              controller: _ctrl,
                              maxLines: null,
                              expands: true,
                              onChanged: (_) => _save(),
                              style: const TextStyle(fontSize: 15, height: 2.1, color: Colors.black87),
                              decoration: const InputDecoration(hintText: 'اكتب ملاحظاتك ومسائلك هنا...', border: InputBorder.none),
                            ),
                          ),
                        ),
                        if (isPen)
                          GestureDetector(
                            onPanStart: (d) => setState(() { strokes.putIfAbsent(page, () => []); strokes[page]!.add([d.localPosition]); }),
                            onPanUpdate: (d) => setState(() => strokes[page]!.last.add(d.localPosition)),
                            child: Container(color: Colors.transparent),
                          ),
                      ],
                    ),
                  ),
                ),
                bottomNavigationBar: Container(
                  color: const Color(0xFF252836),
                  padding: const EdgeInsets.all(8),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      ElevatedButton(onPressed: page > 1 ? () { _save(); setState(() => page--); _load(); } : null, child: const Text('السابقة')),
                      Text('ورقة $page من 10', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                      ElevatedButton(onPressed: page < 10 ? () { _save(); setState(() => page++); _load(); } : null, child: const Text('التالية')),
                    ],
                  ),
                ),
              );
            }
          }

          class NbPainter extends CustomPainter {
            final List<List<Offset>> strokes;
            NbPainter(this.strokes);

            @override
            void paint(Canvas canvas, Size size) {
              final p = Paint()..color = const Color(0xFFE4E9ED)..strokeWidth = 1;
              for (double y = 32; y < size.height; y += 32) {
                canvas.drawLine(Offset(0, y), Offset(size.width, y), p);
              }
              final redP = Paint()..color = Colors.redAccent..strokeWidth = 2;
              canvas.drawLine(Offset(size.width - 35, 0), Offset(size.width - 35, size.height), redP);

              final drawP = Paint()..color = Colors.black87..strokeWidth = 3..strokeCap = StrokeCap.round..style = PaintingStyle.stroke;
              for (final s in strokes) {
                for (int i = 0; i < s.length - 1; i++) {
                  canvas.drawLine(s[i], s[i + 1], drawP);
                }
              }
            }
            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          // حاسبة المجموع والنسبة للثانوية العامة
          class ThanaweyaCalculatorDialog extends StatefulWidget {
            const ThanaweyaCalculatorDialog({super.key});

            @override
            State<ThanaweyaCalculatorDialog> createState() => _ThanaweyaCalculatorDialogState();
          }

          class _ThanaweyaCalculatorDialogState extends State<ThanaweyaCalculatorDialog> {
            final TextEditingController _scoreCtrl = TextEditingController();
            String resultText = '';

            void calculate() {
              final double? score = double.tryParse(_scoreCtrl.text);
              if (score != null && score >= 0 && score <= 410) {
                double perc = (score / 410) * 100;
                setState(() {
                  resultText = 'النسبة المئوية: ${perc.toStringAsFixed(2)}%';
                });
              } else {
                setState(() {
                  resultText = 'يرجى إدخال مجموع صحيح من 410';
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              return Dialog(
                backgroundColor: const Color(0xFF1E1B4B),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          const Text('حاسبة مجموع الثانوية العامة', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                          IconButton(icon: const Icon(Icons.close, color: Colors.red), onPressed: () => Navigator.pop(context)),
                        ],
                      ),
                      const SizedBox(height: 10),
                      TextField(
                        controller: _scoreCtrl,
                        keyboardType: TextInputType.number,
                        style: const TextStyle(color: Colors.white),
                        decoration: const InputDecoration(labelText: 'مجموع الطالب (من 410)', labelStyle: TextStyle(color: Colors.white60)),
                      ),
                      const SizedBox(height: 14),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2563EB), foregroundColor: Colors.white),
                        onPressed: calculate,
                        child: const Text('احسب النسبة المئوية'),
                      ),
                      if (resultText.isNotEmpty) ...[
                        const SizedBox(height: 14),
                        Text(resultText, style: const TextStyle(color: Color(0xFF38BDF8), fontSize: 16, fontWeight: FontWeight.bold)),
                      ]
                    ],
                  ),
                ),
              );
            }
          }

          // مؤقت غرفة التركيز (بومودورو)
          class FocusTimerDialog extends StatefulWidget {
            const FocusTimerDialog({super.key});

            @override
            State<FocusTimerDialog> createState() => _FocusTimerDialogState();
          }

          class _FocusTimerDialogState extends State<FocusTimerDialog> {
            int timeLeft = 25 * 60;
            bool isRunning = false;
            Timer? timer;

            void startTimer() {
              if (isRunning) return;
              setState(() => isRunning = true);
              timer = Timer.periodic(const Duration(seconds: 1), (t) {
                if (timeLeft > 0) {
                  setState(() => timeLeft--);
                } else {
                  t.cancel();
                  setState(() => isRunning = false);
                }
              });
            }

            void stopTimer() {
              timer?.cancel();
              setState(() { isRunning = false; timeLeft = 25 * 60; });
            }

            @override
            void dispose() {
              timer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              int mins = timeLeft ~/ 60;
              int secs = timeLeft % 60;
              return Dialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                child: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('غرفة التركيز (بومودورو 25 دقيقة)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                      const SizedBox(height: 20),
                      Text('${mins.toString().padLeft(2, '0')}:${secs.toString().padLeft(2, '0')}', style: const TextStyle(fontSize: 40, fontWeight: FontWeight.bold, color: Color(0xFF2563EB))),
                      const SizedBox(height: 20),
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          ElevatedButton(onPressed: startTimer, child: const Text('ابدأ المذاكرة')),
                          const SizedBox(width: 10),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red, foregroundColor: Colors.white), onPressed: stopTimer, child: const Text('إعادة')),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // جدول الحصص والمواعيد
          class ScheduleDialog extends StatefulWidget {
            final SharedPreferences prefs;
            const ScheduleDialog({super.key, required this.prefs});

            @override
            State<ScheduleDialog> createState() => _ScheduleDialogState();
          }

          class _ScheduleDialogState extends State<ScheduleDialog> {
            final TextEditingController _ctrl = TextEditingController();
            List<String> items = [];

            @override
            void initState() {
              super.initState();
              items = widget.prefs.getStringList('thanaweya_schedule') ?? ['حصة الفيزياء - السبت 4 عصراً', 'مراجعة العربي - الإثنين 6 مساءً'];
            }

            void _save() {
              widget.prefs.setStringList('thanaweya_schedule', items);
            }

            @override
            Widget build(BuildContext context) {
              return Dialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('جدول الحصص والمواعيد', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                        TextField(controller: _ctrl, decoration: const InputDecoration(labelText: 'مادة الدرس واليوم والوقت')),
                        const SizedBox(height: 10),
                        ElevatedButton(
                          onPressed: () {
                            if (_ctrl.text.trim().isEmpty) return;
                            setState(() {
                              items.add(_ctrl.text.trim());
                              _ctrl.clear();
                              _save();
                            });
                          },
                          child: const Text('إضافة للجدول'),
                        ),
                        const SizedBox(height: 10),
                        ...items.map((item) => ListTile(
                          title: Text(item, style: const TextStyle(fontSize: 12)),
                          trailing: IconButton(
                            icon: const Icon(Icons.delete, color: Colors.red, size: 18),
                            onPressed: () {
                              setState(() {
                                items.remove(item);
                                _save();
                              });
                            },
                          ),
                        )),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
