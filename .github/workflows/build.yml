name: Build Fani Pro AAB and APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project
        run: |
          flutter create --org com.pro.ap4016842 --project-name skn app_project
          cd app_project
          flutter pub add webview_flutter
          flutter pub add webview_flutter_android
          flutter pub add onesignal_flutter
          flutter pub add share_plus

      - name: Configure Android Settings & Permissions
        run: |
          cd app_project
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:hardwareAccelerated="true"/g' android/app/src/main/AndroidManifest.xml
          
          # استبدال شامل ودقيق لـ minSdkVersion ليصبح 21 بدون فشل
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle
          sed -i 's/versionCode.*/versionCode 11/g' android/app/build.gradle

      - name: Write Full Optimized Flutter Code
        run: |
          cat << 'EOF' > app_project/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:onesignal_flutter/onesignal_flutter.dart';
          import 'package:share_plus/share_plus.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            
            // تهيئة OneSignal
            OneSignal.Debug.setLogLevel(OSLogLevel.none);
            OneSignal.initialize("e405d6b4-3828-482c-b294-5a77c30cdd9a");
            OneSignal.Notifications.requestPermission(true);

            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: FaniProScreen(),
            ));
          }

          class FaniProScreen extends StatefulWidget {
            const FaniProScreen({super.key});

            @override
            State<FaniProScreen> createState() => _FaniProScreenState();
          }

          class _FaniProScreenState extends State<FaniProScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();

              final PlatformWebViewControllerCreationParams params =
                  const PlatformWebViewControllerCreationParams();
              final WebViewController controller =
                  WebViewController.fromPlatformCreationParams(params);

              controller
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setUserAgent('Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36')
                ..addJavaScriptChannel(
                  'AppShare',
                  onMessageReceived: (JavaScriptMessage message) {
                    Share.share(message.message);
                  },
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (String url) {
                      setState(() => _isLoading = true);
                    },
                    onPageFinished: (String url) {
                      setState(() => _isLoading = false);
                      controller.runJavaScript("if (window.updateBadgeUI) { window.updateBadgeUI(); }");
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://hrinnf.blogspot.com/'));

              if (controller.platform is AndroidWebViewController) {
                AndroidWebViewController.enableDebugging(false);
                (controller.platform as AndroidWebViewController)
                    .setMediaPlaybackRequiresUserGesture(false);
              }

              OneSignal.Notifications.addForegroundWillDisplayListener((event) {
                final notif = event.notification;
                final title = (notif.title ?? 'تنبيه جديد').replaceAll("'", "\\'");
                final body = (notif.body ?? '').replaceAll("'", "\\'");
                final launchUrl = (notif.additionalData?['launch_url'] ?? '').toString().replaceAll("'", "\\'");

                controller.runJavaScript("""
                  if (window.onNewNotificationReceived) {
                    window.onNewNotificationReceived();
                  }
                  if (window.saveIncomingNotification) {
                    window.saveIncomingNotification('$title', '$body', '$launchUrl');
                  }
                """);
              });

              _controller = controller;
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                    return false;
                  }
                  return true;
                },
                child: Scaffold(
                  backgroundColor: const Color(0xFF6C5CE7),
                  body: SafeArea(
                    child: Stack(
                      children: [
                        WebViewWidget(controller: _controller),
                        if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(
                              color: Colors.white,
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Both AAB and APK
        run: |
          cd app_project
          flutter build appbundle --release --no-pub
          flutter build apk --release --no-pub

      - name: Upload Both Files
        uses: actions/upload-artifact@v4
        with:
          name: fani-pro-packages
          path: |
            app_project/build/app/outputs/bundle/release/app-release.aab
            app_project/build/app/outputs/flutter-apk/app-release.apk
